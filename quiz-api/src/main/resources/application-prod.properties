server.port=${PORT:8080}
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=2
debug=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.oauth2.enabled=true
app.frontend.url=${APP_PUBLIC_URL:${RENDER_EXTERNAL_URL:}}
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend.url}/login/oauth2/code/google
