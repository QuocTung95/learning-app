spring.application.name=quiz-api
# Load the Google configuration for normal local runs, including IDE Run.
spring.profiles.default=local,oauth2
# Local credentials live in the ignored application-local.properties file.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@quizdb_low?TNS_ADMIN=${ORACLE_TNS_ADMIN:../wallet_quizdb}}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
app.oauth2.enabled=${APP_OAUTH2_ENABLED:false}
